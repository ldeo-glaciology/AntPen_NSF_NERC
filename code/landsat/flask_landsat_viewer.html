<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{-webkit-text-size-adjust:100%}*{box-sizing:border-box}</style>
</head>
<body>
<title>Flask Landsat Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Barlow:wght@400;500&display=swap">
<style>
/* Layout: an instrument view. The image is the page; a season-by-year record runs beneath it and one narrow panel of readings sits beside it. */
:root {
  color-scheme: dark;
  --ground: #0b1013; --panel: #12191d; --raise: #1a2329; --line: #2a363d;
  --fg: #dce5e8; --muted: #8fa0a8; --dim: #4c5b63;
  --accent: #7ad3cf; --flag: #f0b74a; --warn: #e58f6f;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--fg); font: 14px/1.4 var(--body); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app {
  height: 100%; display: grid; gap: 10px;
  grid-template: "stage side" minmax(0, 1fr) "record side" 128px / minmax(0, 1fr) 292px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stage { grid-area: stage; position: relative; min-height: 0; background: #000; overflow: hidden; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay { position: absolute; font: 12px var(--data); color: var(--fg); background: rgb(11 16 19 / .78); padding: 3px 7px; }
#readout { right: 8px; bottom: 8px; font-variant-numeric: tabular-nums; }
#loading { right: 8px; top: 8px; color: var(--accent); }
#zoomctl { left: 8px; top: 8px; padding: 0; display: flex; }
#zoomctl button { width: 30px; height: 30px; background: none; border: 0; cursor: pointer; }
#zoomctl button:hover { background: var(--raise); }
#message { inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; background: rgb(11 16 19 / .9); font: 15px/1.5 var(--body); padding: 24px; text-align: center; }

#record { grid-area: record; position: relative; background: var(--panel); min-height: 0; }
#timeline { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: none; }

#side { grid-area: side; display: flex; flex-direction: column; gap: 14px; background: var(--panel); padding: 12px 14px; overflow-y: auto; min-height: 0; min-width: 0; }
h1 { margin: 0; font: 600 13px/1.2 var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); text-wrap: balance; }
#date { font: 600 40px/1 var(--display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
#time { font: 12px var(--data); color: var(--muted); }
#sceneid { font: 11px/1.35 var(--data); color: var(--muted); overflow-wrap: anywhere; user-select: all; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; min-height: 20px; }
.pill { font: 500 12px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; background: var(--raise); }
.pill.warn { color: var(--warn); }
.pill.flagged { color: var(--flag); }
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; font: 12px/1.6 var(--data); text-align: right; font-variant-numeric: tabular-nums; }

.controls { display: flex; flex-direction: column; gap: 8px; }
.transport { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.btn { background: var(--raise); border: 1px solid var(--line); padding: 6px 8px; cursor: pointer; min-height: 32px; }
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn.wide { width: 100%; }
#position { width: 100%; accent-color: var(--accent); margin: 0; }
#count { font: 12px var(--data); color: var(--muted); font-variant-numeric: tabular-nums; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

fieldset { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 10px 0 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
legend { padding: 0 8px 0 0; font: 600 13px/1 var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.chips .btn { padding: 5px 2px; font-size: 13px; }
label.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
label.row select { background: var(--raise); border: 1px solid var(--line); padding: 3px 4px; max-width: 150px; }
label.row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.value { font: 12px var(--data); min-width: 3.5em; text-align: right; }
#keys { font: 11px/1.7 var(--data); color: var(--muted); }
kbd { font: inherit; color: var(--fg); }
#note { font-size: 12px; color: var(--flag); }
#copyout { width: 100%; height: 60px; background: var(--ground); border: 1px solid var(--line); font: 11px var(--data); resize: vertical; }

@media (max-width: 820px) {
  html, body { height: auto; }
  #app { height: auto; grid-template: "stage" 62vh "record" 118px "side" auto / minmax(0, 1fr); }
  #side { overflow: visible; }
  #keys { display: none; }
}
</style>

<div id="app">
  <div id="stage" aria-label="Landsat scene">
    <canvas id="view"></canvas>
    <div class="overlay" id="zoomctl">
      <button id="zoomin" aria-label="Zoom in">+</button>
      <button id="zoomout" aria-label="Zoom out">−</button>
      <button id="zoomfit" aria-label="Fit the area to the window">⤢</button>
    </div>
    <div class="overlay" id="loading" hidden>loading</div>
    <div class="overlay" id="readout" hidden></div>
    <div class="overlay" id="message" hidden></div>
  </div>

  <div id="record"><canvas id="timeline" aria-label="Every scene by season and month. Select a mark to open that scene."></canvas></div>

  <aside id="side">
    <div>
      <h1 id="title">Landsat record</h1>
      <div id="note" hidden></div>
    </div>
    <div>
      <div id="date">—</div>
      <div id="time"></div>
    </div>
    <div class="pills" id="pills"></div>
    <dl id="facts"></dl>
    <div id="sceneid"></div>

    <div class="controls">
      <div class="head"><span id="count"></span></div>
      <input type="range" id="position" min="0" max="0" value="0" aria-label="Position in the filtered scenes">
      <div class="transport">
        <button class="btn" id="prev" aria-label="Previous scene">←</button>
        <button class="btn" id="play" aria-pressed="false" aria-label="Play">Play</button>
        <button class="btn" id="next" aria-label="Next scene">→</button>
        <button class="btn" id="flag" aria-pressed="false" aria-label="Flag this scene">Flag</button>
      </div>
      <label class="row">Speed
        <select id="speed">
          <option value="2">2 scenes/s</option>
          <option value="5" selected>5 scenes/s</option>
          <option value="10">10 scenes/s</option>
          <option value="20">20 scenes/s</option>
        </select>
      </label>
    </div>

    <fieldset>
      <legend>Show</legend>
      <label class="row">Image <select id="band"></select></label>
      <div class="chips" id="sensors"></div>
      <label class="row">Cloud at most <input type="range" id="cloud" min="0" max="100" step="5" value="100"><span class="value" id="cloudval">any</span></label>
      <label class="row">Sun above <input type="range" id="sun" min="-30" max="30" step="1" value="0"><span class="value" id="sunval">0°</span></label>
      <label class="row">Season
        <select id="season">
          <option value="all">All year</option>
          <option value="10,11,12,1,2,3">Oct–Mar</option>
          <option value="12,1,2">Dec–Feb</option>
        </select>
      </label>
      <label class="row">WRS path <select id="path"></select></label>
      <label class="row">Flagged only <input type="checkbox" id="onlyflag"></label>
      <button class="btn wide" id="reset">Show all daylight scenes</button>
    </fieldset>

    <fieldset>
      <legend>Keep</legend>
      <button class="btn wide" id="download" hidden>Download GeoTIFF</button>
      <button class="btn wide" id="copypath" hidden>Copy COG paths for QGIS</button>
      <button class="btn wide" id="copyflags">Copy flagged scene IDs</button>
      <textarea id="copyout" hidden readonly aria-label="Text to copy"></textarea>
    </fieldset>

    <div id="keys"><kbd>←</kbd> <kbd>→</kbd> step · <kbd>shift</kbd> ×10 · <kbd>space</kbd> play<br><kbd>b</kbd> next band · <kbd>f</kbd> flag · <kbd>o</kbd> outline<br><kbd>0</kbd> fit · scroll to zoom</div>
  </aside>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const SENSORS = { M: "MSS", T: "TM", E: "ETM+", C: "OLI", O: "OLI" };
  const SENSOR_ORDER = ["MSS", "TM", "ETM+", "OLI"];
  const PRELOAD_AHEAD = 14, PRELOAD_BEHIND = 4, KEEP_RANGE = 40, MAX_LOADS = 6;
  const SLC_FAILURE = Date.UTC(2003, 4, 31);
  const BAND_ORDER = ["coastal", "blue", "green", "red", "nir08", "nir09", "swir16", "swir22", "pan", "cirrus", "lwir", "lwir_high", "lwir11", "lwir12"];

  const store = {
    get() { try { return JSON.parse(localStorage.getItem("flask-landsat-flags") || "[]"); } catch { return []; } },
    set(ids) { try { localStorage.setItem("flask-landsat-flags", JSON.stringify(ids)); } catch { /* flags last for this visit */ } },
  };

  const S = {
    index: null, all: [], list: [], pos: 0, flags: new Set(store.get()),
    sensors: new Set(SENSOR_ORDER), band: "rgb", playing: false, outline: true,
    zoom: 1, cx: 0, cy: 0, shown: null, cache: new Map(), loading: 0, queue: [], lastStep: 0, dir: 1,
  };

  /* ---------- images ---------- */
  // RGB mode keeps every scene in the record, using the scene's best single band if it has no composite
  const imageName = (scene) => (S.band !== "rgb" ? S.band : scene.images.rgb ? "rgb" : scene.default);
  const imageKey = (scene) => `${imageName(scene)}/${scene.id}`;
  function load(scene) {
    const key = imageKey(scene);
    let hit = S.cache.get(key);
    if (hit) return hit;
    hit = { img: new Image(), ready: false, info: scene.images[imageName(scene)] };
    hit.promise = new Promise((resolve) => { hit.resolve = resolve; });
    S.cache.set(key, hit);
    S.queue.push([key, hit]);
    pump();
    return hit;
  }
  function pump() {
    while (S.loading < MAX_LOADS && S.queue.length) {
      const [key, hit] = S.queue.shift();
      S.loading++;
      hit.img.src = `browse/${key}.webp`;
      hit.img.decode().then(() => { hit.ready = true; }, () => { hit.failed = true; }).finally(() => {
        S.loading--; hit.resolve(); pump();
      });
    }
  }
  function preload() {
    const near = new Set();
    S.queue.length = 0; // nearby scenes matter more than anything already waiting
    for (const [key, hit] of S.cache) if (!hit.ready && !hit.failed && !hit.img.src) S.cache.delete(key);
    for (let i = 0; i <= PRELOAD_AHEAD; i++) {
      const ahead = S.list[S.pos + i * S.dir];
      if (ahead) load(ahead);
      if (i && i <= PRELOAD_BEHIND) { const back = S.list[S.pos - i * S.dir]; if (back) load(back); }
    }
    for (let i = -KEEP_RANGE; i <= KEEP_RANGE; i++) { const s = S.list[S.pos + i]; if (s) near.add(imageKey(s)); }
    for (const key of S.cache.keys()) if (!near.has(key) && S.cache.size > KEEP_RANGE * 2) S.cache.delete(key);
  }

  /* ---------- map geometry ---------- */
  const view = $("view"), ctx = view.getContext("2d");
  function fitScale() {
    const [x0, y0, x1, y1] = S.index.aoi_bounds;
    return Math.min(view.width / (x1 - x0), view.height / (y1 - y0));
  }
  const scale = () => fitScale() * S.zoom;
  const toScreen = (x, y) => [view.width / 2 + (x - S.cx) * scale(), view.height / 2 - (y - S.cy) * scale()];
  const toWorld = (px, py) => [S.cx + (px - view.width / 2) / scale(), S.cy - (py - view.height / 2) / scale()];
  function fit() {
    const [x0, y0, x1, y1] = S.index.aoi_bounds;
    S.zoom = 1; S.cx = (x0 + x1) / 2; S.cy = (y0 + y1) / 2;
    draw();
  }
  function zoomAt(factor, px, py) {
    const [wx, wy] = toWorld(px, py);
    S.zoom = Math.min(60, Math.max(0.5, S.zoom * factor));
    const [nx, ny] = toScreen(wx, wy);
    S.cx += (nx - px) / scale(); S.cy -= (ny - py) / scale();
    draw();
  }
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    for (const c of [view, $("timeline")]) {
      const r = c.getBoundingClientRect();
      c.width = Math.max(1, Math.round(r.width * dpr));
      c.height = Math.max(1, Math.round(r.height * dpr));
    }
    if (S.index) { draw(); drawTimeline(); }
  }

  function draw() {
    if (!S.index) return;
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = css("--ground");
    ctx.fillRect(0, 0, view.width, view.height);

    const scene = S.list[S.pos];
    const hit = scene && S.cache.get(imageKey(scene));
    if (hit && hit.ready) S.shown = hit;
    if (hit && hit.failed) S.shown = null; // better a gap than an image the readout doesn't describe
    $("loading").hidden = !scene || !!(hit && (hit.ready || hit.failed));

    if (S.shown) {
      const [x0, y0, x1, y1] = S.shown.info.bounds;
      const [ax, ay] = toScreen(x0, y1), [bx, by] = toScreen(x1, y0);
      const pixelsPerCell = scale() * S.shown.info.res;
      ctx.imageSmoothingEnabled = pixelsPerCell < 1.5; // show true pixels once zoomed in
      ctx.drawImage(S.shown.img, ax, ay, bx - ax, by - ay);
    }

    if (S.outline) {
      ctx.strokeStyle = css("--accent");
      ctx.lineWidth = 1.2 * dpr;
      ctx.setLineDash([6 * dpr, 4 * dpr]);
      ctx.beginPath();
      S.index.aoi_vertices.forEach(([x, y], i) => { const [px, py] = toScreen(x, y); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.stroke();
      ctx.setLineDash([]);
    }
    drawScaleBar(dpr);
  }
  function drawScaleBar(dpr) {
    const target = 120 * dpr / scale();
    const options = [100, 200, 500, 1000, 2000, 5000, 10000, 20000];
    const metres = options.reduce((best, m) => (Math.abs(m - target) < Math.abs(best - target) ? m : best));
    const length = metres * scale();
    const x = 12 * dpr, y = view.height - 14 * dpr;
    ctx.fillStyle = "rgb(11 16 19 / .78)";
    ctx.fillRect(x - 6 * dpr, y - 20 * dpr, length + 12 * dpr, 28 * dpr);
    ctx.fillStyle = css("--fg");
    ctx.fillRect(x, y, length, 3 * dpr);
    ctx.font = `${11 * dpr}px ${css("--data")}`;
    ctx.fillText(metres >= 1000 ? `${metres / 1000} km` : `${metres} m`, x, y - 6 * dpr);
  }

  /* ---------- season-by-year record ---------- */
  const tl = $("timeline"), tlx = tl.getContext("2d");
  const PAD = { left: 34, right: 10, top: 8, bottom: 18 };
  function seasonCoords(scene) {
    const d = scene.date;
    const month = d.getUTCMonth(), year = d.getUTCFullYear();
    const season = month >= 6 ? year : year - 1; // Jul-Jun, so one austral summer stays in one column
    const start = Date.UTC(season, 6, 1);
    return { season, frac: (d.getTime() - start) / (Date.UTC(season + 1, 6, 1) - start) };
  }
  function timelineScale() {
    const dpr = window.devicePixelRatio || 1;
    const first = S.firstSeason, last = S.lastSeason;
    const left = PAD.left * dpr, right = tl.width - PAD.right * dpr, top = PAD.top * dpr, bottom = tl.height - PAD.bottom * dpr;
    const colW = (right - left) / (last - first + 1);
    return { dpr, left, right, top, bottom, colW,
      x: (s) => left + (s.coords.season - first + 0.5) * colW,
      y: (s) => top + s.coords.frac * (bottom - top),
    };
  }
  function drawTimeline() {
    if (!S.all.length) return;
    const t = timelineScale(), { dpr } = t;
    tlx.clearRect(0, 0, tl.width, tl.height);
    tlx.font = `${10 * dpr}px ${css("--data")}`;
    tlx.textBaseline = "middle";

    // Month guides: 0 = 1 Jul, 0.5 is about 1 Jan
    [["Jul", 0], ["Jan", 0.504], ["Jul", 1]].forEach(([label, f]) => {
      const y = t.top + f * (t.bottom - t.top);
      tlx.strokeStyle = css("--line");
      tlx.lineWidth = 1;
      tlx.beginPath(); tlx.moveTo(t.left, y); tlx.lineTo(t.right, y); tlx.stroke();
      tlx.fillStyle = css("--muted");
      tlx.textAlign = "right";
      tlx.fillText(label, t.left - 5 * dpr, y);
    });

    // Season labels, thinned to fit
    tlx.textAlign = "center";
    const step = t.colW * 10 > 50 * dpr ? 10 : 20;
    for (let s = Math.ceil(S.firstSeason / step) * step; s <= S.lastSeason; s += step) {
      const x = t.left + (s - S.firstSeason + 0.5) * t.colW;
      tlx.fillStyle = css("--muted");
      tlx.fillText(String(s), x, tl.height - 8 * dpr);
    }

    const size = Math.max(2 * dpr, Math.min(t.colW * 0.7, 4 * dpr));
    const inList = new Set(S.list.map((s) => s.id));
    const dim = css("--dim"), fg = css("--fg"), flag = css("--flag");
    for (const s of S.all) {
      const on = inList.has(s.id);
      tlx.fillStyle = S.flags.has(s.id) ? flag : on ? fg : dim;
      tlx.globalAlpha = on || S.flags.has(s.id) ? 0.9 : 0.5;
      tlx.fillRect(t.x(s) - size / 2, t.y(s) - size / 2, size, size);
    }
    tlx.globalAlpha = 1;
    const cur = S.list[S.pos];
    if (cur) {
      tlx.strokeStyle = css("--accent");
      tlx.lineWidth = 2 * dpr;
      tlx.strokeRect(t.x(cur) - size - 2 * dpr, t.y(cur) - size - 2 * dpr, size * 2 + 4 * dpr, size * 2 + 4 * dpr);
    }
  }
  function timelinePick(event) {
    if (!S.list.length) return;
    const r = tl.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    const px = (event.clientX - r.left) * dpr, py = (event.clientY - r.top) * dpr;
    const t = timelineScale();
    let best = 0, bestD = Infinity;
    S.list.forEach((s, i) => {
      const dx = (t.x(s) - px) * 2, dy = t.y(s) - py; // favour the right season over the right month
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    });
    show(best);
  }

  /* ---------- scene readout ---------- */
  const fmt = (v, digits, unit) => (v === null || v === undefined ? "not recorded" : `${v.toFixed(digits)}${unit}`);
  function renderMeta(scene) {
    if (!scene) {
      $("date").textContent = "—"; $("time").textContent = ""; $("facts").textContent = ""; $("pills").textContent = ""; $("sceneid").textContent = "";
      labelDownload();
      return;
    }
    $("date").textContent = scene.datetime.slice(0, 10);
    $("time").textContent = `${scene.datetime.slice(11, 16)} UTC`;
    const name = imageName(scene), info = scene.images[name];
    const rows = [
      ["Sensor", `${scene.sensor} · L${scene.platform.split("_")[1]}`],
      ["Sun elevation", fmt(scene.sun, 1, "°")],
      ["Scene cloud", fmt(scene.cloud, 0, "%")],
      ["WRS path/row", `${Number(scene.path)}/${Number(scene.row)}`],
      ["Shown", `${name === "rgb" ? scene.composite.join(", ") : name} · ${info.res} m`],
      ["Valid in crop", `${Math.round(info.valid * 100)}%`],
    ];
    const facts = $("facts");
    facts.textContent = "";
    rows.forEach(([k, v]) => {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      facts.append(dt, dd);
    });
    const pills = [];
    if (name === "rgb" && !scene.composite.includes("blue")) pills.push(["False colour", "warn"]);
    if (S.band === "rgb" && name !== "rgb") pills.push([`No RGB: ${name} only`, "warn"]);
    if (scene.sun !== null && scene.sun <= 0) pills.push(["Night", "warn"]);
    if (scene.level === "L1GS") pills.push(["Not terrain-corrected", "warn"]);
    if (scene.sensor === "ETM+" && scene.date.getTime() > SLC_FAILURE) pills.push(["SLC-off stripes", "warn"]);
    if (S.flags.has(scene.id)) pills.push(["Flagged", "flagged"]);
    const box = $("pills");
    box.textContent = "";
    pills.forEach(([text, kind]) => {
      const span = document.createElement("span");
      span.className = `pill ${kind}`;
      span.textContent = text;
      box.append(span);
    });
    $("sceneid").textContent = scene.id;
    $("flag").setAttribute("aria-pressed", String(S.flags.has(scene.id)));
    $("copypath").hidden = !S.index.cogs_available;
    $("download").hidden = !S.index.cogs_available;
    labelDownload();
    $("stage").setAttribute("aria-label", `${scene.sensor} scene from ${scene.datetime.slice(0, 10)}`);
  }

  function show(pos) {
    if (!S.list.length) { S.pos = 0; renderMeta(null); draw(); drawTimeline(); return; }
    pos = (pos + S.list.length) % S.list.length;
    S.dir = pos >= S.pos || (S.pos === S.list.length - 1 && pos === 0) ? 1 : -1;
    S.pos = pos;
    const scene = S.list[pos];
    $("position").value = pos;
    $("count").textContent = `${pos + 1} of ${S.list.length} shown · ${S.all.length} with images`;
    renderMeta(scene);
    const hit = load(scene);
    if (hit.ready) draw();
    else { draw(); hit.promise.then(() => { if (S.list[S.pos] === scene) draw(); }); }
    drawTimeline();
    preload();
    try { history.replaceState(null, "", `#${scene.id}`); } catch { /* not available in some frames */ }
  }

  /* ---------- filters ---------- */
  function applyFilters(keepId) {
    const cloud = Number($("cloud").value), sun = Number($("sun").value);
    const months = $("season").value === "all" ? null : new Set($("season").value.split(",").map(Number));
    const path = $("path").value, onlyFlag = $("onlyflag").checked;
    S.band = $("band").value;
    $("cloudval").textContent = cloud === 100 ? "any" : `${cloud}%`;
    $("sunval").textContent = `${sun}°`;
    S.list = S.all.filter((s) =>
      S.sensors.has(s.sensor)
      && (S.band === "rgb" || s.images[S.band]) // a single band never switches product partway through a run
      && (cloud === 100 || (s.cloud !== null && s.cloud <= cloud))
      && (s.sun === null || s.sun > sun)
      && (!months || months.has(s.date.getUTCMonth() + 1))
      && (path === "all" || s.path === path)
      && (!onlyFlag || S.flags.has(s.id)));

    $("position").max = Math.max(0, S.list.length - 1);
    const message = $("message");
    message.hidden = S.list.length > 0;
    if (!S.list.length) {
      message.textContent = "No scenes match these filters.";
      $("count").textContent = `0 of ${S.all.length} shown`;
      stop();
      show(0);
      return;
    }
    // Stay on the same scene, or the nearest in time, so changing a filter doesn't lose your place
    let pos = S.list.findIndex((s) => s.id === keepId);
    if (pos < 0 && keepId) {
      const anchor = S.byId.get(keepId).date.getTime();
      let bestGap = Infinity;
      S.list.forEach((s, i) => { const gap = Math.abs(s.date.getTime() - anchor); if (gap < bestGap) { bestGap = gap; pos = i; } });
    }
    show(Math.max(pos, 0));
  }
  const currentId = () => (S.list[S.pos] ? S.list[S.pos].id : S.currentFallback);
  function refilter() { const id = currentId(); S.currentFallback = id; applyFilters(id); }
  function resetFilters(openAll) {
    S.sensors = new Set(SENSOR_ORDER);
    document.querySelectorAll("#sensors .btn").forEach((b) => b.setAttribute("aria-pressed", "true"));
    $("band").value = "rgb"; $("cloud").value = 100; $("sun").value = openAll ? -30 : 0; $("season").value = "all"; $("path").value = "all"; $("onlyflag").checked = false;
  }

  /* ---------- playback ---------- */
  function stop() { S.playing = false; $("play").textContent = "Play"; $("play").setAttribute("aria-pressed", "false"); }
  function tick(now) {
    if (!S.playing) return;
    const interval = 1000 / Number($("speed").value);
    if (now - S.lastStep >= interval && S.list.length) {
      const next = S.list[(S.pos + 1) % S.list.length];
      const hit = load(next);
      if (hit.ready || hit.failed) { S.lastStep = now; show(S.pos + 1); } // wait rather than show a blank frame
    }
    requestAnimationFrame(tick);
  }
  function togglePlay() {
    if (S.playing) { stop(); return; }
    if (!S.list.length) return;
    S.playing = true;
    $("play").textContent = "Pause";
    $("play").setAttribute("aria-pressed", "true");
    S.lastStep = 0;
    requestAnimationFrame(tick);
  }
  function step(delta) { stop(); show(S.pos + delta); }
  function stepBand(delta) {
    const menu = $("band"), n = menu.options.length;
    menu.selectedIndex = (menu.selectedIndex + delta + n) % n;
    refilter();
  }
  function toggleFlag() {
    const scene = S.list[S.pos];
    if (!scene) return;
    if (S.flags.has(scene.id)) S.flags.delete(scene.id); else S.flags.add(scene.id);
    store.set([...S.flags]);
    renderMeta(scene);
    drawTimeline();
    if ($("onlyflag").checked) refilter();
  }

  async function copyText(text, button, doneLabel) {
    const out = $("copyout"), original = button.textContent;
    try {
      await navigator.clipboard.writeText(text);
      out.hidden = true;
      button.textContent = doneLabel;
      setTimeout(() => { button.textContent = original; }, 1400);
    } catch {
      out.hidden = false; out.value = text; out.focus(); out.select();
    }
  }

  /* ---------- GeoTIFF download ---------- */
  const GEOTIFF_JS = "https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js";
  const GEOTIFF_JS_INTEGRITY = "sha384-m5adk5PRgt3JjiYbYoG8oXxc3EgRFKc1aCBgKzyxqxnbYpdiAMlHkR0gVDp03Q/H";
  const cogPath = (scene, band) => `${scene.id}/${scene.id}_${band}.tif`;

  function labelDownload() {
    const button = $("download"), scene = S.list[S.pos];
    if (S.downloadNote) { button.textContent = S.downloadNote; return; }
    if (!scene) { button.textContent = "Download GeoTIFF"; return; }
    const name = imageName(scene);
    const what = name !== "rgb" ? name : scene.composite.includes("blue") ? "RGB" : scene.composite.join("/");
    button.textContent = `Download ${what} GeoTIFF`;
  }
  function noteDownload(text, seconds) {
    S.downloadNote = text;
    labelDownload();
    clearTimeout(S.downloadTimer);
    if (seconds) S.downloadTimer = setTimeout(() => { S.downloadNote = null; labelDownload(); }, seconds * 1000);
  }
  function saveAs(href, filename) {
    const link = document.createElement("a");
    link.href = href;
    link.download = filename;
    document.body.append(link);
    link.click();
    link.remove();
  }

  // The library is only needed to read COGs for an RGB download, so it loads on the first one
  function loadGeotiffLibrary() {
    S.geotiffLibrary ||= new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = GEOTIFF_JS;
      script.integrity = GEOTIFF_JS_INTEGRITY;
      script.crossOrigin = "anonymous";
      script.onload = () => resolve(window.GeoTIFF);
      script.onerror = () => { S.geotiffLibrary = null; script.remove(); reject(new Error("the GeoTIFF library didn't load")); };
      document.head.append(script);
    });
    return S.geotiffLibrary;
  }
  async function readCog(library, path) {
    const response = await fetch(path);
    if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
    const image = await (await library.fromArrayBuffer(await response.arrayBuffer())).getImage(0);
    const [values] = await image.readRasters();
    return {
      values, width: image.getWidth(), height: image.getHeight(), nodata: image.getGDALNoData(),
      origin: image.getOrigin(), resolution: image.getResolution(),
      // Landsat COGs tie their origin to pixel centres, so this has to travel with the origin
      rasterType: image.getGeoKeys().GTRasterTypeGeoKey ?? 1,
    };
  }

  // A one-strip, uncompressed, little-endian GeoTIFF holding the bands exactly as stored, pixel-interleaved
  function writeGeotiff(bands, names, epsg) {
    const { values, width, height, nodata, origin, resolution, rasterType } = bands[0];
    const Pixels = values.constructor, nBands = bands.length, nValues = width * height * nBands;
    if (Pixels !== Uint8Array && Pixels !== Uint16Array) throw new Error(`unexpected data type ${Pixels.name}`);
    const descriptions = names.map((name, i) => `<Item name="DESCRIPTION" sample="${i}" role="description">${name}</Item>`).join("");
    const ascii = (text) => [...text].map((c) => c.charCodeAt(0)).concat(0);
    const SIZES = { 2: 1, 3: 2, 4: 4, 12: 8 };
    const ASCII = 2, SHORT = 3, LONG = 4, DOUBLE = 12;
    const bytes = nValues * Pixels.BYTES_PER_ELEMENT;
    const tags = [
      [256, LONG, [width]],
      [257, LONG, [height]],
      [258, SHORT, Array(nBands).fill(Pixels.BYTES_PER_ELEMENT * 8)],
      [259, SHORT, [1]],
      [262, SHORT, [2]],
      [273, LONG, [0]],
      [277, SHORT, [nBands]],
      [278, LONG, [height]],
      [279, LONG, [bytes]],
      [284, SHORT, [1]],
      [339, SHORT, Array(nBands).fill(1)],
      [33550, DOUBLE, [resolution[0], Math.abs(resolution[1]), 0]],
      [33922, DOUBLE, [0, 0, 0, origin[0], origin[1], 0]],
      [34735, SHORT, [1, 1, 0, 3, 1024, 0, 1, 1, 1025, 0, 1, rasterType, 3072, 0, 1, epsg]],
      [42112, ASCII, ascii(`<GDALMetadata>${descriptions}</GDALMetadata>`)],
    ];
    if (nodata !== null) tags.push([42113, ASCII, ascii(String(nodata))]);

    // Values too long for their directory entry follow the directory, each on an 8-byte boundary, then the pixels
    const align = (offset) => (offset + 7) & ~7;
    let end = align(8 + 2 + tags.length * 12 + 4);
    const placed = tags.map(([, type, list]) => {
      const size = SIZES[type] * list.length;
      if (size <= 4) return null;
      const at = end;
      end = align(end + size);
      return at;
    });
    tags[5][2] = [end];

    const buffer = new ArrayBuffer(end + bytes), view = new DataView(buffer);
    view.setUint16(0, 0x4949, true);
    view.setUint16(2, 42, true);
    view.setUint32(4, 8, true);
    view.setUint16(8, tags.length, true);
    const put = { 2: "setUint8", 3: "setUint16", 4: "setUint32", 12: "setFloat64" };
    tags.forEach(([code, type, list], i) => {
      const entry = 10 + i * 12, size = SIZES[type];
      view.setUint16(entry, code, true);
      view.setUint16(entry + 2, type, true);
      view.setUint32(entry + 4, list.length, true);
      if (placed[i] !== null) view.setUint32(entry + 8, placed[i], true);
      const start = placed[i] ?? entry + 8;
      list.forEach((value, j) => view[put[type]](start + j * size, value, true));
    });
    const pixels = new Pixels(buffer, end, nValues);
    bands.forEach((band, b) => {
      for (let i = 0; i < band.values.length; i++) pixels[i * nBands + b] = band.values[i];
    });
    return buffer;
  }

  async function buildComposite(scene) {
    const library = await loadGeotiffLibrary();
    const bands = await Promise.all(scene.composite.map((band) => readCog(library, cogPath(scene, band))));
    const grid = ({ values, width, height, nodata, origin, resolution, rasterType }) => JSON.stringify([values.constructor.name, width, height, nodata, origin, resolution, rasterType]);
    if (new Set(bands.map(grid)).size > 1) throw new Error("the three bands don't share a grid");
    return writeGeotiff(bands, scene.composite, Number(S.index.crs.split(":")[1]));
  }

  async function download() {
    const scene = S.list[S.pos];
    if (!scene || S.downloading) return;
    const name = imageName(scene);
    if (name !== "rgb") { saveAs(cogPath(scene, name), `${scene.id}_${name}.tif`); return; }
    S.downloading = true;
    noteDownload("Preparing GeoTIFF…");
    try {
      const url = URL.createObjectURL(new Blob([await buildComposite(scene)], { type: "image/tiff" }));
      saveAs(url, `${scene.id}_${scene.composite.join("_")}.tif`);
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      noteDownload(null);
    } catch (error) {
      console.error("GeoTIFF download failed:", error);
      noteDownload("Download failed, try again", 3);
    }
    S.downloading = false;
  }

  /* ---------- wiring ---------- */
  function wire() {
    $("download").onclick = download;
    $("prev").onclick = () => step(-1);
    $("next").onclick = () => step(1);
    $("play").onclick = togglePlay;
    $("flag").onclick = toggleFlag;
    $("position").oninput = (e) => { stop(); show(Number(e.target.value)); };
    $("position").onchange = (e) => e.target.blur();
    for (const id of ["band", "cloud", "sun", "season", "path", "onlyflag"]) {
      $(id).addEventListener("input", refilter);
      $(id).addEventListener("change", (e) => e.target.blur());
    }
    $("speed").onchange = (e) => e.target.blur();
    $("reset").onclick = () => { resetFilters(false); refilter(); };
    $("zoomin").onclick = () => zoomAt(1.5, view.width / 2, view.height / 2);
    $("zoomout").onclick = () => zoomAt(1 / 1.5, view.width / 2, view.height / 2);
    $("zoomfit").onclick = fit;
    $("copyflags").onclick = (e) => {
      const ids = [...S.flags].sort();
      if (ids.length) copyText(ids.join("\n"), e.target, `Copied ${ids.length}`);
      else { const b = e.target, t = b.textContent; b.textContent = "No scenes flagged yet"; setTimeout(() => { b.textContent = t; }, 1400); }
    };
    $("copypath").onclick = (e) => {
      const s = S.list[S.pos];
      if (!s) return;
      const name = imageName(s), base = location.href.split("#")[0];
      const paths = (name === "rgb" ? s.composite : [name]).map((band) => `/vsicurl/${new URL(cogPath(s, band), base)}`);
      copyText(paths.join("\n"), e.target, "Copied");
    };

    window.addEventListener("keydown", (e) => {
      if (["SELECT", "TEXTAREA"].includes(e.target.tagName)) return;
      if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
      const jump = e.shiftKey ? 10 : 1;
      const keys = {
        ArrowRight: () => step(jump), ArrowLeft: () => step(-jump),
        Home: () => { stop(); show(0); }, End: () => { stop(); show(S.list.length - 1); },
        " ": togglePlay, f: toggleFlag, b: () => stepBand(1), B: () => stepBand(-1), o: () => { S.outline = !S.outline; draw(); }, 0: fit,
      };
      const act = keys[e.key];
      if (act) { e.preventDefault(); act(); }
    });

    // Pan and zoom hold steady across scenes, so one spot can be compared through time
    const stage = $("stage");
    const dprNow = () => window.devicePixelRatio || 1;
    let drag = null;
    stage.addEventListener("wheel", (e) => {
      e.preventDefault();
      const r = view.getBoundingClientRect();
      zoomAt(Math.exp(-e.deltaY * 0.0016), (e.clientX - r.left) * dprNow(), (e.clientY - r.top) * dprNow());
    }, { passive: false });
    view.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; view.setPointerCapture(e.pointerId); stage.classList.add("dragging"); });
    view.addEventListener("pointermove", (e) => {
      const r = view.getBoundingClientRect();
      const [wx, wy] = toWorld((e.clientX - r.left) * dprNow(), (e.clientY - r.top) * dprNow());
      const readout = $("readout");
      readout.hidden = false;
      readout.textContent = `${S.index.crs}  x ${Math.round(wx)}  y ${Math.round(wy)} m`;
      if (!drag) return;
      S.cx -= (e.clientX - drag.x) * dprNow() / scale();
      S.cy += (e.clientY - drag.y) * dprNow() / scale();
      drag = { x: e.clientX, y: e.clientY };
      draw();
    });
    const endDrag = () => { drag = null; stage.classList.remove("dragging"); };
    view.addEventListener("pointerup", endDrag);
    view.addEventListener("pointercancel", endDrag);
    view.addEventListener("dblclick", fit);
    view.addEventListener("pointerleave", () => { $("readout").hidden = true; });

    let scrubbing = false;
    tl.addEventListener("pointerdown", (e) => { scrubbing = true; tl.setPointerCapture(e.pointerId); stop(); timelinePick(e); });
    tl.addEventListener("pointermove", (e) => { if (scrubbing) timelinePick(e); });
    tl.addEventListener("pointerup", () => { scrubbing = false; });
    tl.addEventListener("pointercancel", () => { scrubbing = false; });

    new ResizeObserver(resize).observe($("stage"));
    new ResizeObserver(resize).observe($("record"));
  }

  function fail(text) {
    const m = $("message");
    m.hidden = false;
    m.textContent = text;
  }

  async function start() {
    let index;
    try {
      const response = await fetch("index.json");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      index = await response.json();
    } catch (error) {
      fail(`The scene list (index.json) didn't load: ${error.message}. If you opened this file directly from disk, serve the folder instead with: python -m http.server`);
      return;
    }
    S.index = index;
    S.all = index.scenes.filter((s) => Object.keys(s.images).length).map((s) => ({ ...s, date: new Date(s.datetime), sensor: SENSORS[s.id[1]] || "OLI" }));
    S.all.sort((a, b) => a.date - b.date);
    S.all.forEach((s) => { s.coords = seasonCoords(s); });
    S.byId = new Map(S.all.map((s) => [s.id, s]));
    S.firstSeason = Math.min(...S.all.map((s) => s.coords.season));
    S.lastSeason = Math.max(...S.all.map((s) => s.coords.season));

    $("title").textContent = index.title;
    if (index.preview_note) { $("note").hidden = false; $("note").textContent = index.preview_note; }

    const sensors = $("sensors");
    SENSOR_ORDER.forEach((name) => {
      const n = S.all.filter((s) => s.sensor === name).length;
      const b = document.createElement("button");
      b.className = "btn";
      b.textContent = name;
      b.title = `${n} scenes`;
      b.setAttribute("aria-pressed", "true");
      b.disabled = n === 0;
      b.onclick = () => {
        if (S.sensors.has(name)) S.sensors.delete(name); else S.sensors.add(name);
        b.setAttribute("aria-pressed", String(S.sensors.has(name)));
        refilter();
      };
      sensors.append(b);
    });
    const counts = new Map();
    S.all.forEach((s) => Object.keys(s.images).forEach((name) => counts.set(name, (counts.get(name) || 0) + 1)));
    const rank = (name) => { const i = BAND_ORDER.indexOf(name); return i < 0 ? BAND_ORDER.length : i; };
    const bandNames = [...counts.keys()].filter((name) => name !== "rgb").sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
    const bandSel = $("band");
    [["rgb", `RGB (${counts.get("rgb") || 0})`], ...bandNames.map((name) => [name, `${name} (${counts.get(name)})`])].forEach(([value, label]) => {
      const o = document.createElement("option");
      o.value = value; o.textContent = label;
      bandSel.append(o);
    });
    const paths = new Map();
    S.all.forEach((s) => paths.set(s.path, (paths.get(s.path) || 0) + 1));
    const pathSel = $("path");
    [["all", `All (${S.all.length})`], ...[...paths].sort(([a], [b]) => a - b).map(([p, n]) => [p, `${Number(p)} (${n})`])].forEach(([value, label]) => {
      const o = document.createElement("option");
      o.value = value; o.textContent = label;
      pathSel.append(o);
    });

    wire();
    resize();
    const [x0, y0, x1, y1] = index.aoi_bounds;
    S.cx = (x0 + x1) / 2; S.cy = (y0 + y1) / 2;

    const hashId = location.hash.slice(1);
    const target = S.byId.has(hashId) ? hashId : null;
    if (target) { resetFilters(true); applyFilters(target); }
    else {
      // Open on the latest clear daylight scene: the first frame should show the glacier
      const clear = [...S.all].reverse().find((s) => s.sun > 15 && s.cloud !== null && s.cloud < 25);
      applyFilters(clear ? clear.id : null);
    }
  }
  start();
})();
</script>

</body>
</html>
